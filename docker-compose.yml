name: qahub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qahub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qahub-local}
      POSTGRES_DB: qahub
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qahub -d qahub"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
