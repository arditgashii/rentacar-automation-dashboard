name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The seed reads the test catalog from the QA repo and the commit history from the platform repo, so
# the e2e job checks out all three side by side, the same layout as on a developer machine.
env:
  DATABASE_URL: postgres://qahub:qahub-local@localhost:5433/qahub
  # Only for this throwaway CI database and server; not a secret.
  SESSION_SECRET: ci-only-session-secret-for-throwaway-runs
  SEED_PASSWORD: QaHub!2026
  QA_REPO_PATH: ../rentacar-qa-automation
  PLATFORM_REPO_PATH: ../rentacar-platform
  QA_PYTHON: python
  APP_URL: http://localhost:3100
  TEAMS_ALLOW_LOCAL_WEBHOOK: "1"

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rentacar-automation-dashboard
    steps:
      - uses: actions/checkout@v5
        with:
          path: rentacar-automation-dashboard
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rentacar-automation-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qahub
          POSTGRES_PASSWORD: qahub-local
          POSTGRES_DB: qahub
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U qahub -d qahub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: rentacar-automation-dashboard
    steps:
      - uses: actions/checkout@v5
        with:
          path: rentacar-automation-dashboard
      - uses: actions/checkout@v5
        with:
          repository: arditgashii/rentacar-qa-automation
          path: rentacar-qa-automation
      - uses: actions/checkout@v5
        with:
          repository: arditgashii/rentacar-platform
          path: rentacar-platform
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rentacar-qa-automation/requirements.txt
      - name: Install the QA suite (only to read its test catalog)
        run: pip install -r ../rentacar-qa-automation/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rentacar-automation-dashboard/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            rentacar-automation-dashboard/playwright-report
            rentacar-automation-dashboard/test-results
          retention-days: 7
